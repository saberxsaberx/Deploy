<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Flagm8</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="unity-webview.js"></script>
    <style>
      #mobile-fullscreen-toggle {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1000;
        background: rgba(0,0,0,0.6);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 18px;
        cursor: pointer;
        display: none;
        transition: background 0.2s;
      }
      #mobile-fullscreen-toggle.active {
        background: rgba(0,0,0,0.85);
      }
      @media (max-width: 900px) {
        #unity-container.unity-mobile, #unity-canvas {
          width: 100vw !important;
          height: 100vh !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        html, body {
          width: 100vw;
          height: 100vh;
          margin: 0;
          padding: 0;
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <button id="mobile-fullscreen-toggle" title="Toggle Fullscreen">⛶</button>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Flagm8</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Deploy3.loader.js";
      var config = {
        dataUrl: buildUrl + "/Deploy3.data",
        frameworkUrl: buildUrl + "/Deploy3.framework.js",
        codeUrl: buildUrl + "/Deploy3.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Flagm8",
        productVersion: "1.0.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var width0 = "1066px";
      var height0 = "600px";

      // 📱 Detect mobile
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        container.className = "unity-mobile";

        // 🎯 Smart Scaling
        var rawDPR = window.devicePixelRatio || 1;
        var maxDPR = 2.0; // حداکثر کیفیت
        var minDPR = 1.0; // حداقل کیفیت
        var smartDPR = Math.min(Math.max(rawDPR, minDPR), maxDPR);

        config.devicePixelRatio = smartDPR;

        function resizeCanvas() {
          canvas.width = window.innerWidth * smartDPR;
          canvas.height = window.innerHeight * smartDPR;
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
        }

        function fitMobileCanvas() {
          resizeCanvas();
          container.style.width = "100vw";
          container.style.height = "100vh";
        }

        fitMobileCanvas();
        window.addEventListener("resize", fitMobileCanvas);
        window.addEventListener("orientationchange", fitMobileCanvas);

        document.getElementById('mobile-fullscreen-toggle').style.display = "block";
      } else {
        canvas.style.width = "1066px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      document.addEventListener(
        'fullscreenchange',
        function() {
          var p = document.getElementById('unity-container');
          var c = document.getElementById('unity-canvas');
          if (document.fullscreenElement) {
            width0 = c.style.width;
            height0 = c.style.height;
            setTimeout(
              function() {
                c.style.width = getComputedStyle(p).width;
                c.style.height = getComputedStyle(p).height;
              },
              250);
          } else {
            c.style.width = width0;
            c.style.height = height0;
          }
        });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            var p = document.getElementById('unity-container');
            var c = document.getElementById('unity-canvas');
            c.requestFullscreen = () => {
              p.requestFullscreen();
            };
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // Mobile fullscreen toggle logic
      if (isMobile) {
        var fsBtn = document.getElementById('mobile-fullscreen-toggle');
        function updateFSBtn() {
          if (document.fullscreenElement) {
            fsBtn.textContent = "🡸";
            fsBtn.classList.add("active");
          } else {
            fsBtn.textContent = "⛶";
            fsBtn.classList.remove("active");
          }
        }
        fsBtn.addEventListener("click", function() {
          var elem = document.getElementById('unity-container');
          if (!document.fullscreenElement) {
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
          }
        });
        document.addEventListener('fullscreenchange', updateFSBtn);
        document.addEventListener('webkitfullscreenchange', updateFSBtn);
        document.addEventListener('msfullscreenchange', updateFSBtn);
        updateFSBtn();
      }
    </script>
  </body>
</html>
